[project]
name = "personal-trading-lab"
version = "0.1.0"
description = "Trading ledger and evidence-grounded research experiments"
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "ruff==0.14.6",
    "PyYAML==6.0.3",
    "import-linter==2.5.2; python_version < '3.10'",
    "import-linter==2.15; python_version == '3.10'",
    "import-linter==2.16; python_version >= '3.11'",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".local", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests", "services/research/tests"]
