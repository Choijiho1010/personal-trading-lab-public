name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install pinned tools
        run: |
          python -m pip install uv==0.13.5
          go install -ldflags "-X github.com/zricethezav/gitleaks/v8/cmd.Version=8.24.2" github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Check source and synthetic behavior
        run: uv run --frozen python scripts/quality.py check
      - name: Check React application
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          FIRST_DEMO_UI_REPORT="$RUNNER_TEMP/first-demo-review.md" npm test
          npm run build
      - name: Check Spring Boot application
        working-directory: services/trading
        run: ./gradlew --no-daemon test bootJar
      - name: Check integrated synthetic HTTP paths
        run: |
          run_case() {
            local delay="$1"
            shift
            RESEARCH_SYNTHETIC_DELAY_MS="$delay" python3 scripts/run_first_demo.py &
            demo_pid=$!
            for attempt in {1..40}; do
              if curl --fail --silent http://127.0.0.1:5173/api/v1/fills/demo-fill-1 >/dev/null; then
                break
              fi
              kill -0 "$demo_pid"
              sleep 1
            done
            python3 scripts/verify_first_demo.py --report "$RUNNER_TEMP/first-demo-review.md" "$@"
            kill "$demo_pid"
            wait "$demo_pid"
            demo_pid=
          }
          demo_pid=
          trap 'if [[ -n "$demo_pid" ]]; then kill "$demo_pid" 2>/dev/null || true; fi' EXIT
          run_case 0
          run_case 1500 --expect-timeout
      - name: Audit tracked content and history
        run: uv run --frozen python scripts/quality.py audit
      - name: Show synthetic execution evidence
        if: always()
        run: |
          report="$RUNNER_TEMP/first-demo-review.md"
          if [[ -s "$report" ]]; then
            {
              printf '%s\n' '## 첫 데모 실행 근거' ''
              printf '%s\n' 'React 화면 상태는 합성 응답을 사용한 jsdom 테스트에서 관찰했다. HTTP 검사는 세 서비스를 실행한 결과다.' ''
              cat "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
