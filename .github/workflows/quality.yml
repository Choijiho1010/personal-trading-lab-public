name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install pinned tools
        run: |
          python -m pip install uv==0.13.5
          go install -ldflags "-X github.com/zricethezav/gitleaks/v8/cmd.Version=8.24.2" github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv sync --frozen
      - name: Check source and synthetic behavior
        run: uv run --frozen python scripts/quality.py check
      - name: Audit tracked content and history
        run: uv run --frozen python scripts/quality.py audit
